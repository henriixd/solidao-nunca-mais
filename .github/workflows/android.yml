name: App Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEM_CHAVE: ${{ secrets.SNM_KEYSTORE_BASE64 != '' && 'sim' || 'nao' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK de teste
        run: ./gradlew --no-daemon assembleDebug

      - name: Guardar o APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: solidao-nunca-mais-teste
          path: android/app/build/outputs/apk/debug/*.apk

      # Link fixo para baixar o APK de teste direto no celular
      - name: Publicar APK de teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/solidao-nunca-mais-teste.apk"
          gh release delete app-teste -y --cleanup-tag || true
          gh release create app-teste "$RUNNER_TEMP/solidao-nunca-mais-teste.apk" \
            --prerelease --target "$GITHUB_SHA" --title "App para teste" \
            --notes "Versão de teste do app Solidão Nunca Mais (não é a da Play Store). Gerada automaticamente a partir do commit $GITHUB_SHA."

      # Imagens das telas, geradas sem celular, para conferir o visual
      - name: Gerar capturas de tela
        continue-on-error: true
        run: ./gradlew --no-daemon recordRoborazziDebug

      - name: Publicar capturas de tela
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/capturas"
          cp app/build/capturas/*.png "$RUNNER_TEMP/capturas/"
          cd "$RUNNER_TEMP/capturas"
          git init -q && git checkout -q -b app-capturas
          git add . && git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Capturas de $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-capturas

      # Versão para a Play Store (.aab), só quando a chave de assinatura estiver
      # cadastrada nos "secrets" do repositório.
      - name: Preparar chave de assinatura
        if: env.TEM_CHAVE == 'sim'
        env:
          SNM_KEYSTORE_BASE64: ${{ secrets.SNM_KEYSTORE_BASE64 }}
        run: echo "$SNM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Gerar pacote para a Play Store
        if: env.TEM_CHAVE == 'sim'
        env:
          SNM_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          SNM_KEYSTORE_PASSWORD: ${{ secrets.SNM_KEYSTORE_PASSWORD }}
          SNM_KEY_ALIAS: ${{ secrets.SNM_KEY_ALIAS }}
          SNM_KEY_PASSWORD: ${{ secrets.SNM_KEY_PASSWORD }}
          SNM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Guardar o pacote da Play Store
        if: env.TEM_CHAVE == 'sim'
        uses: actions/upload-artifact@v4
        with:
          name: solidao-nunca-mais-play-store
          path: android/app/build/outputs/bundle/release/*.aab
